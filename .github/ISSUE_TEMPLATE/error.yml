name: Error
description: Algo no funciona como debería
labels: ["tipo:bug"]
body:
  - type: textarea
    id: que
    attributes: { label: Qué pasó, description: "Incluye el identificador de la petición (X-Request-Id) si lo tienes" }
    validations: { required: true }
  - type: textarea
    id: esperado
    attributes: { label: Qué esperabas }
    validations: { required: true }
  - type: textarea
    id: pasos
    attributes: { label: Pasos para reproducirlo }
  - type: dropdown
    id: entorno
    attributes: { label: Entorno, options: [Producción, Preproducción, Local] }
  - type: input
    id: incidente
    attributes:
      label: Incidente del piloto
      description: "Folio del incidente en el sistema (INC-2027-000123), si lo hay"
