name: seguridad
# Cada lunes: dependencias con vulnerabilidades conocidas (OWASP) y la imagen que está en main.
on:
  schedule:
    - cron: '17 13 * * 1'   # lunes 7:17 en Ciudad de México
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  dependencias:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: OWASP Dependency-Check (CVSS 7 o más falla)
        working-directory: backend
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: >
          ./mvnw -B -ntp org.owasp:dependency-check-maven:check
          -DfailBuildOnCVSS=7 -DnvdApiKey="$NVD_API_KEY" -Dformats=HTML,JSON
      - name: Auditoría npm
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  imagen:
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: echo "IMAGEN=ghcr.io/${GITHUB_REPOSITORY,,}:main" >> "$GITHUB_ENV"
      - uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          version: v0.69.3
          image-ref: ${{ env.IMAGEN }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
