name: release
# Cada fusión a main con CI en verde: imagen en GHCR etiquetada con el SHA, escaneo con Trivy y
# despliegue automático a preproducción. Producción recibe la misma imagen en H7 (deploy-prod.yml).
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: preproduccion
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGEN: ghcr.io/${{ github.repository }}

jobs:
  imagen:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.version.outputs.sha }}
    steps:
      - id: version
        run: echo "sha=${{ github.event.workflow_run.head_sha || github.sha }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.version.outputs.sha }}
      - name: Imagen en minúsculas (GHCR lo exige)
        run: echo "IMAGEN=${IMAGEN,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Construir (misma caché que el e2e de CI)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: ${{ env.IMAGEN }}:${{ steps.version.outputs.sha }}
          build-args: APP_VERSION=${{ steps.version.outputs.sha }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,scope=app,mode=max
      # Fijado al commit de v0.35.0: el único tag que no fue alterado en el ataque de marzo de 2026
      # (GHSA-69fq-xp46-6x23). Trivy v0.69.3 es versión verificada como segura.
      - name: Escaneo de vulnerabilidades (crítica o alta sin parche bloquea)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          version: v0.69.3
          image-ref: ${{ env.IMAGEN }}:${{ steps.version.outputs.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
      - name: Publicar
        run: |
          docker tag "$IMAGEN:${{ steps.version.outputs.sha }}" "$IMAGEN:main"
          docker push "$IMAGEN:${{ steps.version.outputs.sha }}"
          docker push "$IMAGEN:main"

  preproduccion:
    needs: imagen
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: preproduccion
      url: ${{ vars.PREPROD_URL }}
    permissions:
      contents: read
      packages: read
    env:
      VERSION: ${{ needs.imagen.outputs.version }}
      HOST: ${{ vars.PREPROD_HOST }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.imagen.outputs.version }}
      # El servidor no expone el puerto 22: se entra por la red privada de Tailscale.
      - uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      - name: Llave SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.PREPROD_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts
      - name: Copiar la definición del entorno (viaja con el código)
        run: |
          chmod +x infra/scripts/*.sh infra/db/init/*.sh
          scp -p infra/compose/compose.yml infra/compose/Caddyfile infra/scripts/desplegar.sh \
            infra/scripts/revertir.sh "deploy@$HOST:/opt/constructora/"
          scp -p infra/db/init/*.sh "deploy@$HOST:/opt/constructora/db-init/"
      - name: Desplegar
        run: |
          # shellcheck disable=SC2029  # VERSION se expande aquí a propósito
          # El token de GitHub dura lo que dura este job: el servidor no guarda credenciales vigentes.
          echo "${{ secrets.GITHUB_TOKEN }}" | ssh "deploy@$HOST" \
            "docker login ghcr.io -u '${{ github.actor }}' --password-stdin >/dev/null && /opt/constructora/desplegar.sh '$VERSION'; s=\$?; docker logout ghcr.io >/dev/null; exit \$s"
      - name: Comprobar desde internet que responde la versión nueva
        run: |
          for _ in $(seq 1 20); do
            if curl -fsS "${{ vars.PREPROD_URL }}/api/v1/version" | jq -e --arg v "$VERSION" '.version == $v' >/dev/null; then
              echo "Preproducción sirve $VERSION"; exit 0
            fi
            sleep 3
          done
          echo "::error::Preproducción no responde con la versión $VERSION"; exit 1
