name: ci
# Cada push y cada PR hacia las tres ramas del flujo: development → testing → main.
# Ningún PR se fusiona con algo en rojo (protección de ramas).
on:
  pull_request:
    branches: [development, testing, main]
  push:
    branches: [development, testing, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend:
    name: Backend (pruebas contra PostgreSQL 18)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Formato, pruebas, fronteras de módulos y cobertura
        run: ./mvnw -B -ntp spotless:check verify
      - name: Contrato OpenAPI
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openapi
          path: backend/target/openapi.json
          if-no-files-found: error
      - name: Reportes de pruebas y cobertura
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reportes-backend
          path: |
            backend/target/surefire-reports
            backend/target/site/jacoco
          retention-days: 14

  frontend:
    name: Frontend (contrato, lint, pruebas, build)
    needs: backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Contrato recién generado por el backend
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: openapi
          path: /tmp/contrato
      - name: Comparar con el contrato del repositorio
        run: |
          npx --yes prettier --parser json /tmp/contrato/openapi.json > /tmp/contrato/nuevo.json
          npx --yes prettier --parser json openapi.json > /tmp/contrato/actual.json
          if ! diff -q <(jq -S 'del(.servers)' /tmp/contrato/nuevo.json) <(jq -S 'del(.servers)' /tmp/contrato/actual.json) >/dev/null; then
            echo "::warning file=frontend/openapi.json::El contrato del backend cambió. Corre 'make api' y sube frontend/openapi.json."
          fi
          cp /tmp/contrato/openapi.json openapi.json
      - name: Tipos desde el contrato (si el backend rompe al frontend, falla aquí)
        run: npm run gen:api
      - run: npm run lint
      - run: npm test -- --run
      - run: npm run build

  e2e:
    name: Punta a punta (Playwright contra la app en Docker)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MIGRADOR_E2E: migrador-e2e
      APP_E2E: app-e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: openapi
          path: frontend
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Imagen de la app (la misma receta que producción)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: constructora:e2e
          build-args: APP_VERSION=e2e
          cache-from: type=gha,scope=app
          cache-to: type=gha,scope=app,mode=max
      - name: Base, migraciones y app
        run: |
          cd infra/compose
          docker compose -f compose.e2e.yml up -d --wait db
          docker compose -f compose.e2e.yml run --rm --no-build migrar
          docker compose -f compose.e2e.yml up -d --wait --no-build app
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Playwright
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Logs de la app
        if: failure()
        run: docker compose -f infra/compose/compose.e2e.yml logs app migrar
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright
          path: frontend/playwright-report
          retention-days: 7

  infraestructura:
    name: Infraestructura y base (lint, Terraform, pruebas SQL)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres-ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Workflows
        run: |
          pip install --quiet actionlint-py shellcheck-py hadolint-py
          actionlint
      - name: Scripts y Dockerfile
        run: |
          shellcheck -x infra/scripts/*.sh infra/db/init/*.sh tools/pruebas-sql/*.sh
          hadolint Dockerfile
      - name: Herramienta del ensayo general (contra una API simulada)
        run: python3 -m unittest discover -s tools/ensayo -v
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      - name: Terraform
        working-directory: infra/terraform
        run: |
          terraform fmt -check -recursive
          for dir in modulos/servidor preproduccion produccion; do
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
          done
      - name: Defensas de la base (RLS, permisos, bitácora, folios)
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres-ci
        run: tools/pruebas-sql/correr.sh

  secretos:
    name: Secretos (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.28.0 git /repo --redact --verbose
